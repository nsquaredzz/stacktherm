# Python shell over the C++ core: the browser studio and the kALDo bridge.
# Build the core first (see README): the extension module is written into
# stacktherm/ by CMake.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stacktherm"
version = "0.2.0"
description = "3D thermal simulator for chip-stack unit cells with material inputs computed from geometry and atoms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "pybind11>=2.11", "cmake>=3.20", "ninja"]
kaldo = ["kaldo>=2.2"]

[tool.setuptools.packages.find]
include = ["stacktherm*"]

[tool.setuptools.package-data]
stacktherm = ["*.html", "*.so", "*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
